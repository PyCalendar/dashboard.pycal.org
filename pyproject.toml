[project]
name = "dashboard-pycal-org"
dynamic = ["version"]  # from the git tag, by hatch-vcs
description = "A dashboard for the contributor community of github.com/PyCalendar"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<6",
    "django-allauth[socialaccount]>=65",
    "django-environ>=0.14.0",
    "gunicorn>=23",
    "httpx>=0.28.1",
    "pip-licenses>=5.5.5",
    "reuse>=6.3.0",
    "whitenoise>=6.9",
]

[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["pycal_dashboard"]

[tool.uv]
package = false  # uv sync installs the dependencies only; the code runs from the checkout

[project.urls]
Homepage = "https://dashboard.pycal.org"
Documentation = "https://docs.dashboard.pycal.org/"
Source = "https://github.com/PyCalendar/dashboard.pycal.org"
Changelog = "https://docs.dashboard.pycal.org/changelog.html"

[project.optional-dependencies]
docs = [
    "sphinx==9.1.0",
    "pydata-sphinx-theme==0.23.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.7.0",
    "sphinx-notfound-page==1.1.0",
    "towncrier==26.9.0",
]

[dependency-groups]
browser = [
    "playwright==1.65.0",
    "pytest-playwright>=0.7",
]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pycal_dashboard.settings"
pythonpath = ["."]
testpaths = ["tests", "pycal_dashboard"]
addopts = "--doctest-modules --ignore=docs --ignore=docker --ignore=tests/browser"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
extend-exclude = [".claude", ".codex", "pycal_dashboard/migrations", "docs/_build"]

[tool.ruff.lint]
# D: every class and function has a docstring, in Google style
select = ["E", "F", "I", "UP", "D"]
ignore = ["D100", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]

[tool.towncrier]
directory = "news/"
filename = "docs/changelog.rst"
issue_format = "`#{issue} <https://github.com/PyCalendar/dashboard.pycal.org/issues/{issue}>`_"
start_string = ".. towncrier release notes start\n"
title_format = "{version} ({project_date})"
underlines = ["-", "~", "`"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Maintenance"
showcontent = true
