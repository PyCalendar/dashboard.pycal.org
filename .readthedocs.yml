# The documentation on Read the Docs, built with the versions of uv.lock, as in the CI.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.13.5
      - asdf global uv 0.13.5
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --extra docs --no-dev

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
