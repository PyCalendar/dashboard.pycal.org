# The setup of https://dashboard-pycal-org.readthedocs.io/en/latest/how-to/run-docker.html
#   cp .env.example .env    # then edit .env
#   docker compose up -d
#   docker compose logs dashboard   # the setup code of the GitHub App

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  dashboard:
    image: ghcr.io/pycalendar/dashboard.pycal.org:latest
    # build: .   # to use the local code instead
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ./data:/app/data   # the database, the secret key and the GitHub App
    restart: unless-stopped
    logging: *logging

  # Optional: the background work in a container of its own. Set
  # FETCH_WORKER=external-separate-container in .env (then the web container starts no
  # worker) and remove the comments. By default the image runs the worker in the web
  # container (external-http-container), started again when it stops.
  # worker:
  #   image: ghcr.io/pycalendar/dashboard.pycal.org:latest
  #   entrypoint: ["python", "manage.py", "fetch_worker"]
  #   env_file: .env
  #   volumes:
  #     - ./data:/app/data
  #   restart: unless-stopped
  #   logging: *logging
