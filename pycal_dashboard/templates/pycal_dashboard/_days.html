<form class="inline-form days" method="get"><label for="days">Period</label>
  <select id="days" name="days">
    <option value="30"{% if days == 30 %} selected{% endif %}>30 days</option>
    <option value="90"{% if days == 90 %} selected{% endif %}>90 days</option>
    <option value="365"{% if days == 365 %} selected{% endif %}>a year</option>
  </select> <button class="button button-small">Show</button></form>
