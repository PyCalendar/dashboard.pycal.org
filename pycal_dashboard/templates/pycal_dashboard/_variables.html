{% load i18n %}<span class="insert-variable" hidden data-insert-variable="{{ target }}"><label class="visually-hidden" for="variable-{{ target }}">{% translate "Variable" %}</label><select id="variable-{{ target }}">{% for name, meaning in variables.items %}<option value="{{ '{' }}{{ name }}{{ '}' }}">{{ '{' }}{{ name }}{{ '}' }} – {{ meaning }}</option>{% endfor %}</select> <button type="button" class="button button-quiet button-small">{% translate "Insert" %}</button></span>
<details class="variables-help"><summary>{% translate "Variables" %}</summary><ul>{% for name, meaning in variables.items %}<li><code>{{ '{' }}{{ name }}{{ '}' }}</code> {{ meaning }}</li>{% endfor %}</ul></details>
