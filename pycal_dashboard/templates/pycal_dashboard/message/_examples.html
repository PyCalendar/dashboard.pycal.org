{% load i18n %}{% if preview.examples %}<p class="example-nav" data-example-nav><a class="button button-quiet button-small" href="?example={{ preview.example|add:-1 }}" data-example-step="-1" title="{% translate "The example before: one quality check less done" %}" aria-label="{% translate "The example before: one quality check less done" %}"{% if preview.example == 0 or pull_text %} aria-disabled="true"{% endif %}>←</a>
  <span data-example-label>{% if pull_text %}{{ preview.pull }}{% else %}{{ preview.label }}{% endif %}</span>
  <a class="button button-quiet button-small" href="?example={{ preview.example|add:1 }}" data-example-step="1" title="{% translate "The next example: one more quality check done" %}" aria-label="{% translate "The next example: one more quality check done" %}"{% if preview.example|add:1 == preview.examples and not pull_text %} aria-disabled="true"{% endif %}>→</a></p>{% endif %}
<form method="get" class="inline-form" data-show-pull><label for="show-pull">{% translate "The message of the pull request" %}</label><input id="show-pull" name="pull" value="{{ pull_text }}" placeholder="2166" autocomplete="off"><button class="button button-small">{% translate "Show" %}</button></form>
{% if preview.missing %}<p class="message-missing" data-pull-missing>{{ preview.missing }}</p>{% endif %}
