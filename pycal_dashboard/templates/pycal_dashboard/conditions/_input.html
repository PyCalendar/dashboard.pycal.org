{% load i18n %}<p class="condition-input" data-condition-input="{{ spec.name }}" data-type="{{ spec.type }}">
  <label for="input-{{ spec.name }}">{{ spec.label }}</label>
  {% if widget.kind == "number" %}<input id="input-{{ spec.name }}" name="{{ spec.name }}" type="number" inputmode="numeric"{% for key, value in widget.attributes.items %} {{ key }}="{{ value }}"{% endfor %}{% if spec.required %} required{% endif %}{% if value is not None %} value="{{ value }}"{% endif %}>
  {% elif widget.kind == "range" %}<span class="range-input"><input id="input-{{ spec.name }}" name="{{ spec.name }}" type="number" inputmode="numeric" aria-label="{% translate "From" %}"{% for key, value in widget.attributes.items %} {{ key }}="{{ value }}"{% endfor %}{% if spec.required %} required{% endif %}> – <input name="{{ spec.name }}" type="number" inputmode="numeric" aria-label="{% translate "To" %}"{% for key, value in widget.attributes.items %} {{ key }}="{{ value }}"{% endfor %}{% if spec.required %} required{% endif %}></span>
  {% elif widget.kind == "choice" %}<select id="input-{{ spec.name }}" name="{{ spec.name }}"{% if spec.required %} required{% endif %}>{% for choice in widget.choices %}<option value="{{ choice.value }}"{% if choice.value == value %} selected{% endif %}{% if choice.description %} title="{{ choice.description }}"{% endif %}>{{ choice.value }}</option>{% endfor %}</select>
  {% else %}<input id="input-{{ spec.name }}" name="{{ spec.name }}"{% for key, value in widget.attributes.items %} {{ key }}="{{ value }}"{% endfor %}{% if spec.required %} required{% endif %}{% if value is not None %} value="{{ value }}"{% endif %}>{% endif %}
  {% if spec.help %}<small class="muted">{{ spec.help }}</small>{% endif %}
</p>
