# The checks of every change, in parallel jobs: lint and the unit and API tests, the browser
# tests, the documentation and the build of the Docker image. The image is pushed to ghcr.io
# only if all of them pass: "latest" for every commit of main; "stable", "1.2.3" and "1.2" for
# a tag v1.2.3; each for linux/amd64 and linux/arm64. The push builds from the cache of the
# docker job, so the image is built in parallel to the tests. Then Sencho updates the stack of
# the site and the live site is checked as a visitor (docs/how-to/run-docker.rst). The
# documentation of main is published on GitHub Pages: https://docs.dashboard.pycal.org/
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit and API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: make lint
      # on all processors of the runner (pytest-xdist)
      - run: make test

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv run --group browser playwright install --with-deps --only-shell chromium
      - run: make browser-test

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: make docs
      - run: make prose
      - run: make workflows
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  pages:
    name: Publish the documentation on docs.dashboard.pycal.org
    needs: [docs, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  docker:
    name: Build the Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # git describe needs the tags
      - name: Write the build information for the About page
        run: make version
      # the health check of the container, and the setup code of the GitHub App in its log
      - run: make docker-test
      # critical vulnerabilities with a fix fail the build (Trivy)
      - run: make docker-scan
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build for both platforms into the cache, without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-to: type=gha,mode=max
          cache-from: type=gha

  push:
    name: Push the Docker image to ghcr.io
    needs: [test, browser, docs, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Write the build information for the About page
        run: make version
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags of the image
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Push the image built by the docker job (from the cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Sencho
    needs: [push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # one deploy at a time: Sencho refuses a second update of the stack while one runs (409)
    concurrency:
      group: deploy-sencho-dashboard-pycal
      cancel-in-progress: false
    # the secret SENCHO_TOKEN belongs to this environment of the repository
    environment:
      name: dashboard.pycal.org
      url: https://dashboard.pycal.org
    steps:
      - name: Update the stack
        run: |
          # no deployment without the token: the job fails until the stack and the token exist
          if [ -z "$SENCHO_TOKEN" ]; then
            echo "::error::No SENCHO_TOKEN in the environment dashboard.pycal.org: nothing is deployed."
            exit 1
          fi
          # Sencho answers 409 while the stack is deploying, such as by hand, and 5xx for passing
          # errors: wait and retry
          for attempt in $(seq 10); do
            status=$(curl --silent --output response.json --write-out "%{http_code}" \
              --request POST \
              --url "https://sencho.pycal.org/api/stacks/${SENCHO_STACK}/update" \
              --header "Authorization: Bearer $SENCHO_TOKEN")
            cat response.json; echo
            if [ "$status" = 409 ] || [ "$status" -ge 500 ]; then
              echo "::notice::Sencho answered $status; try $attempt of 10, waiting 30 s."
              sleep 30
              continue
            fi
            [ "$status" -lt 300 ] && exit 0
            echo "::error::Sencho answered $status"
            exit 1
          done
          echo "::error::The stack was still deploying after 10 tries."
          exit 1
        env:
          SENCHO_TOKEN: ${{ secrets.SENCHO_TOKEN }}
          SENCHO_STACK: ${{ vars.SENCHO_STACK || 'dashboard-pycal' }}

  live:
    name: Check the live site
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # without secrets: it only visits the public pages, as a visitor (scripts/check_live.py)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      # waits while the updated container starts, then walks the public pages
      - run: make check-live
        env:
          LIVE_URL: https://dashboard.pycal.org
