version = 1

[[annotations]]
path = [
    "*",
    ".claude/**",
    ".codex/**",
    ".github/**",
    ".vale/**",
    "scripts/**",
    "pycal_dashboard/**",
    "docker/**",
    "docs/**",
    "news/**",
    "tests/**",
    "static/style.css",
    "static/*.js",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 dashboard.pycal.org contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The favicon of pycal.org (https://github.com/PyCalendar/pycal.org), scaled to 64x64 pixels
[[annotations]]
path = "static/img/favicon.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 the pycal team"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The mark of GitHub from Primer Octicons (https://github.com/primer/octicons)
[[annotations]]
path = "pycal_dashboard/github_mark.py"
precedence = "override"
SPDX-FileCopyrightText = "GitHub Inc."
SPDX-License-Identifier = "MIT"

# The bar of Markdown above the fields of descriptions: @github/markdown-toolbar-element 2.2.3
# (https://github.com/github/markdown-toolbar-element), as published on npm
[[annotations]]
path = "static/vendor/markdown-toolbar-element-2.2.3.js"
precedence = "override"
SPDX-FileCopyrightText = "2017-2018 GitHub, Inc."
SPDX-License-Identifier = "MIT"

# The names and descriptions of the permissions and events of GitHub Apps, copied from the page of
# the permissions of a GitHub App and from GitHub Docs (https://docs.github.com), whose texts are
# licensed under CC-BY-4.0 (https://github.com/github/docs/blob/main/LICENSE)
[[annotations]]
path = "pycal_dashboard/github/permission_names.txt"
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "CC-BY-4.0"
